<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boxscore">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Boxscore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Permanent opaque cover for the notch/status-bar strip (env(safe-area-inset-top))
     — see .safe-area-top in css/style.css for why this exists. -->
<div class="safe-area-top" aria-hidden="true"></div>
<div class="board">

  <div id="view-board" class="view active">
    <div class="page-header">
      <div class="page-header-top">
        <img class="app-logo" src="icons/logo-header.png" alt="">
        <h1>Teams</h1>
        <label class="picker-hit" for="draft-team-picker">
          <div class="picker-wrap">
            <select class="draft-team-picker" id="draft-team-picker" onchange="setDraftTeam(this.value)"></select>
            <span class="picker-chevron">&#9662;</span>
          </div>
        </label>
      </div>
      <div class="page-sub" id="team-tally">The Draft &middot; &mdash; leagues &middot; &mdash; teams</div>
    </div>
    <div class="filter-chips" id="filter-chips"></div>
    <div class="leagues" id="leagues"></div>
  </div>

  <div id="view-live-now" class="view">
    <div class="page-header">
      <div class="page-header-top">
        <img class="app-logo" src="icons/logo-header.png" alt="">
        <h1>Scores</h1>
      </div>
      <div class="page-sub" id="live-now-sub">Loading today's slate&hellip;</div>
    </div>
    <div id="live-now-controls"></div>
    <div id="live-now-list"></div>
  </div>

  <div id="view-standings" class="view">
    <div class="page-header">
      <div class="page-header-top">
        <img class="app-logo" src="icons/logo-header.png" alt="">
        <h1>Standings</h1>
      </div>
      <div class="page-sub">Real standings, broken down by draft team</div>
    </div>
    <div id="standings-content"></div>
  </div>

  <div id="view-overall" class="view">
    <div class="page-header">
      <div class="page-header-top">
        <img class="app-logo" src="icons/logo-header.png" alt="">
        <h1>Overall</h1>
        <!-- Simulated-data preview toggle — see the "TEMPORARY" block in
             js/overall.js. Remove this control (and that block) once the
             season is far enough along that a fake preview is no
             longer useful. -->
        <div class="ob-mode" id="ob-mode">
          <span class="ob-mode-label">Data</span>
          <div class="ob-mode-switch">
            <button type="button" class="ob-mode-btn active" data-mode="real" onclick="setObMode('real')">Real</button>
            <button type="button" class="ob-mode-btn" data-mode="simulated" onclick="setObMode('simulated')">Simulated</button>
          </div>
        </div>
      </div>
      <div class="page-sub">All 10 drafters, ranked by total points across every league</div>
    </div>
    <div id="overall-content"></div>
  </div>

</div>

<div class="build-tag" id="build-tag"></div>

<!-- Team / league detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeTeamModal()">
  <div class="modal" id="modal-content">
    <!-- content injected by JS -->
  </div>
</div>

<!-- Game Details: stacks on top of the team modal above (Option B —
     see docs/espn-migration-plan.md's Game Details section). Opened by
     js/live-data.js's openGameDetail; the team modal underneath stays
     open and dimmed, not closed. -->
<div class="modal-overlay stacked" id="game-detail-overlay" onclick="if(event.target===this) closeGameDetail()">
  <div class="modal modal-wide" id="game-detail-content">
    <!-- content injected by JS -->
  </div>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" data-view="board" onclick="switchView('board')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
    <span class="tab-label">Teams</span>
  </button>
  <button class="tab-btn" data-view="live-now" onclick="switchView('live-now')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16"></path><circle cx="6" cy="8" r="1.9" fill="currentColor" stroke="none"></circle><circle cx="6" cy="16" r="1.9" fill="currentColor" stroke="none"></circle><path d="M11 8h9"></path><path d="M11 16h6"></path></svg>
    <span class="tab-label">Scores</span>
  </button>
  <button class="tab-btn" data-view="standings" onclick="switchView('standings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h15.5"></path><path d="M4 12h10.5"></path><path d="M4 17.5h6"></path></svg>
    <span class="tab-label">Standings</span>
  </button>
  <button class="tab-btn" data-view="overall" onclick="switchView('overall')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.4" r="1.9" fill="currentColor" stroke="none"></circle><rect x="3.2" y="13" width="4.2" height="7" rx="1"></rect><rect x="9.9" y="8.6" width="4.2" height="11.4" rx="1"></rect><rect x="16.6" y="15.2" width="4.2" height="4.8" rx="1"></rect></svg>
    <span class="tab-label">Overall</span>
  </button>
</nav>

<script type="module" src="js/board.js"></script>
</body>
</html>
