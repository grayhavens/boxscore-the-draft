name = "team-dashboard-rundown-proxy"
main = "rundown-proxy.js"
compatibility_date = "2026-09-01"

# The app calls this worker on its workers.dev address (DASHBOARD_WORKER_BASE
# in js/api.js). Adding `routes` below turns that off unless it's set here.
workers_dev = true

# The system admin API (worker/system-admin.js) answers on the platform's
# own domain, same origin as boxscore.space/admin, so Cloudflare Access
# guards both. Everything else stays on workers.dev.
routes = [
  { pattern = "boxscore.space/api/admin/*", zone_name = "boxscore.space" }
]

# The actual key is NOT set here — it's stored as a Cloudflare secret
# so it never touches source control:
#   npx wrangler secret put THERUNDOWN_API_KEY

# Shared storage for the Results modal's league facts (who won the FA
# Cup, etc.) so a mark made by one drafter is visible to everyone —
# created with `npx wrangler kv namespace create LEAGUE_FACTS`.
# Daily Perigon news batch (worker/news.js): 4 searches a run, ~120 calls a month.
[triggers]
crons = ["17 11 * * *"]

[[kv_namespaces]]
binding = "LEAGUE_FACTS"
id = "abadd3da86124f0fbb586566034a9d52"

# The real-time chat room (worker/chat-room.js) — one Durable Object
# instance shared by everyone, with its history in the object's own
# SQLite storage. The migration below runs once, on the first deploy
# after this was added; class renames/removals need their own new entry.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# The live draft room (worker/draft-room.js): one Durable Object per room
# name, holding the authoritative draft state in its own SQLite storage.
[[durable_objects.bindings]]
name = "DRAFT_ROOM"
class_name = "DraftRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DraftRoom"]
