<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="description" content="Boxscore: fantasy drafts across 9 real leagues, followed and scored live.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Boxscore</title>
<!-- The platform's front door (boxscore.space), where index.html sends
     the bare domain. No manifest or service worker: each group's
     subdomain is what gets installed, never this page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="landing">
<!-- Launch splash, once per tab session — the same one index.html plays
     (js/launch-splash.js), landing on the header logo below. Must stay the
     first thing in <body>, with its classic script right after it. -->
<div id="launch-splash" aria-hidden="true">
  <div class="ls-bg"></div>
  <div class="ls-stage">
    <div class="ls-logo">
      <div class="ls-tl"><i></i></div>
      <div class="ls-br"><i></i></div>
      <div class="ls-sq"></div>
    </div>
    <div class="ls-word"><span><span>B</span></span><span><span>o</span></span><span><span>x</span></span><span><span>s</span></span><span><span>c</span></span><span><span>o</span></span><span><span>r</span></span><span><span>e</span></span></div>
  </div>
</div>
<script src="js/launch-splash.js"></script>
<div class="safe-area-top" aria-hidden="true"></div>
<main class="landing-main">
  <!-- Same header as every view in the app (index.html + js/page-header.js). -->
  <div class="page-header">
    <div class="page-header-top">
      <img class="app-logo landing-logo" src="icons/logo-header.png" alt="">
      <h1>Boxscore</h1>
    </div>
    <div class="page-sub">Fantasy drafts across 9 real leagues, followed and scored live.</div>
  </div>
  <div class="set-label landing-label">How it works</div>
  <section class="hiw" id="hiw" aria-label="How it works"></section>
  <!-- Same button as the Points tab's (js/overall.js); opens the recruiting
       group's rules in the app's scoring sheet (js/landing.js). -->
  <button type="button" class="modal-cta secondary ob-scoring-btn landing-scoring-btn" onclick="openScoringSheet()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V10"></path><path d="M18 20V4"></path><path d="M6 20v-4"></path></svg>
    How scoring works
  </button>
  <div class="set-label landing-label" id="landing-groups-label">Groups</div>
  <nav class="landing-groups" id="landing-groups" aria-label="Groups"></nav>
  <p class="landing-foot" id="landing-foot">Each group is its own app. Open yours, then add it to your Home Screen.</p>
</main>
<!-- Opening a group: the logo above flies to the center and becomes the
     launch splash's built mark (same geometry as index.html #launch-splash),
     then the group's own splash picks up from that frame. See js/landing.js. -->
<div id="landing-handoff" aria-hidden="true" hidden>
  <div class="ls-bg"></div>
  <div class="ls-stage">
    <div class="ls-logo">
      <div class="ls-tl"><i></i></div>
      <div class="ls-br"><i></i></div>
      <div class="ls-sq"></div>
    </div>
  </div>
</div>
<!-- Scoring rules sheet (js/scoring-sheet.js), same markup as index.html's. -->
<div class="modal-overlay dr-modal-back" id="scoring-sheet" onclick="closeScoringSheet()">
  <div class="modal dr-modal" id="scoring-sheet-content" role="dialog" aria-modal="true" aria-label="Scoring" onclick="event.stopPropagation()"></div>
</div>
<script type="module" src="js/landing.js"></script>
</body>
</html>
